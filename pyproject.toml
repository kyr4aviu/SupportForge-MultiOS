[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportforge"
version = "1.0.3"
description = "SupportForge MultiOS offline-first technical support workstation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Dmytro Pavlov", email = "kyr4aviu@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["technical-support", "diagnostics", "linux", "windows", "macos", "gui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
supportforge-gui = "supportforge.gui:main"

[tool.setuptools.packages.find]
include = ["supportforge*"]
